name: signal-alert

# 매일 KST 16:10(= UTC 07:10, 국내 장마감 15:30 이후)에 alerts/watchlist.json의
# 종목들을 돌려서 새로 뜬 신호가 있으면 텔레그램으로 보낸다.
# 평일만(월~금, 1-5) 돈다 — KRX는 주말에 신규 봉이 없음(업비트 코인은 주말에도
# 움직이지만, 이 스케줄은 "하루 한 번 다이제스트"이지 실시간 알림이 아니라는 점을
# 감안해 일단 평일 기준으로 맞춤. 주말에도 돌리고 싶으면 아래 cron의 "1-5"를
# "*"로 바꾸면 됨).
#
# 실행 전 꼭 필요한 준비물(사람이 한 번만 하면 됨):
#   저장소 Settings -> Secrets and variables -> Actions 에 등록:
#     TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   (alerts/telegram.py 상단 docstring에 발급 방법 설명)
on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}  # 저장소의 Actions 탭에서 수동으로도 바로 실행해볼 수 있게

permissions:
  contents: write  # alerts/state.json을 다시 커밋하기 위해 필요

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 신호 체크 + 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m alerts.check_signals

      - name: 알림 발송 기록(state.json) 저장소에 커밋
        run: |
          git config user.name "signal-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts/state.json
          git diff --cached --quiet || git commit -m "chore: update alert state [skip ci]"
          git push
